name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package-lock.json"
      - "tsconfig.base.json"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package-lock.json"
      - "tsconfig.base.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict GITHUB_TOKEN to read-only by default
permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      SKIP_ENV_VALIDATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check (web)
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Format check
        run: npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    # Build requires env vars validated by @t3-oss/env-nextjs at build time.
    # These are dummy values that satisfy the Zod schemas — no real services
    # are contacted during the build (Prisma generate runs offline, SMTP
    # verification only runs at runtime).
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      BETTER_AUTH_SECRET: "ci-dummy-secret-that-is-at-least-32-chars-long"
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_BETTER_AUTH_URL: "http://localhost:3000"
      STRIPE_SECRET_KEY: "sk_test_ci_dummy_key"
      SMTP_HOST: "localhost"
      SMTP_PORT: "587"
      SKIP_ENV_VALIDATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Disable Corepack
        run: |
          corepack disable
          rm -f $(which yarn) $(which yarnpkg) 2>/dev/null || true

      - name: Install dependencies
        run: |
          # Lockfile was generated on Windows and lacks resolved entries for
          # Linux native binaries (e.g. @tailwindcss/oxide-linux-x64-gnu).
          # Regenerate on the CI platform so npm resolves them correctly.
          rm -f package-lock.json
          npm install

      - name: Build
        run: npm run build

  migrate-check:
    name: Prisma Migration Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      SKIP_ENV_VALIDATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check for pending migrations
        working-directory: apps/web
        run: |
          # Verify the Prisma schema is valid
          npx prisma validate

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    continue-on-error: true # E2E requires real secrets; don't block CI if missing
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-dummy-secret-that-is-at-least-32-chars-long' }}
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_BETTER_AUTH_URL: "http://localhost:3000"
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_ci_dummy_key' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST || 'localhost' }}
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SKIP_ENV_VALIDATION: "true"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Disable Corepack
        run: |
          corepack disable
          rm -f $(which yarn) $(which yarnpkg) 2>/dev/null || true

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/web
        run: npx playwright test

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
