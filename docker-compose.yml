services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Override DATABASE_URL at build time if prisma generate needs a real DB.
      # For most cases the placeholder is fine — no DB connection happens at build.
      args:
        DATABASE_URL: "${DATABASE_URL:-postgresql://placeholder:placeholder@localhost:5432/placeholder}"
    image: simple-expenses-web:latest
    ports:
      - "3000:3000"
    # All runtime secrets come from the root .env file.
    # Required: DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL,
    #           NEXT_PUBLIC_BETTER_AUTH_URL, STRIPE_SECRET_KEY,
    #           SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, EMAIL_FROM
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
