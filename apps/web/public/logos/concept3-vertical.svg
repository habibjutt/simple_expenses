<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none" role="img" aria-label="Simple Expenses logo">
  <!-- Card stack, centered at x=80 -->
  <rect x="65" y="32" width="42" height="24" rx="4" fill="#064E3B"/>
  <rect x="59" y="26" width="42" height="24" rx="4" fill="#065F46"/>
  <rect x="53" y="20" width="42" height="24" rx="4" fill="#10B981"/>
  <!-- Chip -->
  <rect x="58" y="24" width="9" height="7" rx="2" fill="white" fill-opacity="0.35"/>
  <!-- Card number -->
  <line x1="58" y1="36" x2="68" y2="36" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="72" y1="36" x2="82" y2="36" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <!-- Wordmark -->
  <text x="80" y="98"  text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Simple</text>
  <text x="80" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#9CA3AF" letter-spacing="4">EXPENSES</text>
</svg>
