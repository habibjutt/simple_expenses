<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3521"/><stop offset="0.55" stop-color="#0f5c37"/><stop offset="1" stop-color="#1a9e5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity="0.35"/><stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#021a0f" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="90" cy="600" r="160" fill="#1a9e5c" opacity="0.25"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- brand -->
    <circle cx="100" cy="118" r="28" fill="#ffffff" fill-opacity="0.18"/>
    <g transform="translate(86 104) scale(1.17)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
    </g>
    <text x="142" y="129" font-size="32" font-weight="800" fill="#ffffff">Fixpenses</text>

    <text x="72" y="268" font-size="64" font-weight="800" fill="#ffffff">Take control of</text>
    <text x="72" y="344" font-size="64" font-weight="800" fill="#6ee7b7">every dirham</text>
    <text x="72" y="408" font-size="25" fill="#d1fae5" fill-opacity="0.9">Expense tracker for UAE residents.</text>
    <text x="72" y="442" font-size="25" fill="#d1fae5" fill-opacity="0.9">No bank login needed.</text>

    <rect x="72" y="492" width="178" height="44" rx="22" fill="#ffffff"/>
    <text x="161" y="521" text-anchor="middle" font-size="18" font-weight="700" fill="#0f5c37">Start free</text>
    <text x="276" y="521" font-size="18" fill="#d1fae5" fill-opacity="0.85">fixpenses.com</text>
  </g>

  <!-- dashboard card -->
  <g filter="url(#shadow)"><rect x="700" y="120" width="420" height="400" rx="26" fill="#ffffff"/></g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="728" y="148" width="176" height="96" rx="16" fill="#1a9e5c"/>
    <text x="746" y="178" font-size="14" fill="#d1fae5">Total balance</text>
    <text x="746" y="214" font-size="26" font-weight="800" fill="#ffffff">AED 24,580</text>
    <rect x="916" y="148" width="176" height="96" rx="16" fill="#f1f5f9"/>
    <text x="934" y="178" font-size="14" fill="#6b7280">Monthly spend</text>
    <text x="934" y="214" font-size="26" font-weight="800" fill="#0f172a">AED 8,230</text>
    <text x="728" y="284" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6b7280">RECENT</text>
    <g font-size="16">
      <text x="728" y="322" font-weight="600" fill="#111827">Carrefour</text>
      <text x="1092" y="322" text-anchor="end" font-weight="700" fill="#111827">-AED 156</text>
      <line x1="728" y1="342" x2="1092" y2="342" stroke="#e5e7eb"/>
      <text x="728" y="376" font-weight="600" fill="#111827">DEWA bill</text>
      <text x="1092" y="376" text-anchor="end" font-weight="700" fill="#111827">-AED 380</text>
      <line x1="728" y1="396" x2="1092" y2="396" stroke="#e5e7eb"/>
      <text x="728" y="430" font-weight="600" fill="#111827">Salary credit</text>
      <text x="1092" y="430" text-anchor="end" font-weight="700" fill="#15803d">+AED 18,000</text>
    </g>
    <rect x="728" y="456" width="364" height="10" rx="5" fill="#f1f5f9"/>
    <rect x="728" y="456" width="300" height="10" rx="5" fill="#1a9e5c"/>
    <text x="728" y="494" font-size="13" fill="#6b7280">Budget used: AED 8,230 of 10,000</text>
  </g>
</svg>
