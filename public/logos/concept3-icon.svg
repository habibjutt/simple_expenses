<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Simple Expenses icon">
  <!-- Back card -->
  <rect x="16" y="20" width="44" height="27" rx="5" fill="#064E3B"/>
  <!-- Middle card -->
  <rect x="10" y="14" width="44" height="27" rx="5" fill="#065F46"/>
  <!-- Front card -->
  <rect x="4"  y="8"  width="44" height="27" rx="5" fill="#10B981"/>
  <!-- Chip -->
  <rect x="9" y="13" width="10" height="8" rx="2" fill="white" fill-opacity="0.35"/>
  <!-- Card number segments -->
  <line x1="9"  y1="26" x2="20" y2="26" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="24" y1="26" x2="35" y2="26" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
